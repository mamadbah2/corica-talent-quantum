<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORICA Talent Quantum — [Titre de l'écran]</title>
<!--
  GABARIT CANONIQUE — à copier pour tout nouvel écran.
  Ce fichier vit à la racine `maquettes/`, donc les chemins ci-dessous
  (assets/, ../brand-assets/) sont ceux qui conviennent à CE niveau.

  ATTENTION — SI TU COPIES CE FICHIER DANS UN SOUS-DOSSIER
  (employe/, manager/, rh-pays/, partages/) :
    - remplace  assets/app.css           par  ../assets/app.css
    - remplace  assets/app.js            par  ../assets/app.js
    - remplace  ../brand-assets/…        par  ../../brand-assets/…
  (un niveau de dossier en plus = un "../" en plus partout)
-->
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <!-- RAIL -->
  <nav class="rail">
    <div class="rail__brand">
      <img class="rail-logo" src="../brand-assets/corica-logo-white.svg" alt="CORICA">
      <img class="rail-mark" src="../brand-assets/corica-mark.svg" alt="CORICA">
      <span class="rail-product">Talent Quantum</span>
    </div>
    <button class="rail__toggle">
      <svg viewBox="0 0 320 512" fill="currentColor"><path d="M15 239c-9.4 9.4-9.4 24.6 0 33.9L207 465c9.4 9.4 24.6 9.4 33.9 0s9.4-24.6 0-33.9L65.9 256 241 81c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0L15 239z"/></svg>
      <span class="navlabel">Réduire le menu</span>
    </button>

    <!-- Exemple de groupe de navigation : dupliquer / adapter selon le rôle (employé, manager, RH pays…) -->
    <div class="rail__group">Pilotage</div>
    <a class="navitem is-active">
      <svg viewBox="0 0 512 512" fill="currentColor"><path d="M0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zM288 96a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zM256 416c35.3 0 64-28.7 64-64c0-17.4-6.9-33.1-18.1-44.6L366 161.7c5.3-12.1-.2-26.3-12.3-31.6s-26.3 .2-31.6 12.3L257.9 288c-.6 0-1.3 0-1.9 0c-35.3 0-64 28.7-64 64s28.7 64 64 64zM176 144a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zM96 288a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm352-32a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg>
      <span class="navlabel">Écran actif (is-active)</span>
    </a>
    <a class="navitem">
      <svg viewBox="0 0 640 512" fill="currentColor"><path d="M144 0a80 80 0 1 1 0 160A80 80 0 1 1 144 0zM512 0a80 80 0 1 1 0 160A80 80 0 1 1 512 0zM0 298.7C0 239.8 47.8 192 106.7 192l42.7 0c15.9 0 31 3.5 44.6 9.7c-1.3 7.2-1.9 14.7-1.9 22.3c0 38.2 16.8 72.5 43.3 96c-.2 0-.4 0-.7 0L21.3 320C9.6 320 0 310.4 0 298.7zM405.3 320c-.2 0-.4 0-.7 0c26.6-23.5 43.3-57.8 43.3-96c0-7.6-.7-15-1.9-22.3c13.6-6.3 28.7-9.7 44.6-9.7l42.7 0C592.2 192 640 239.8 640 298.7c0 11.8-9.6 21.3-21.3 21.3l-213.3 0zM224 224a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zM128 485.3C128 411.7 187.7 352 261.3 352l117.3 0C452.3 352 512 411.7 512 485.3c0 14.7-11.9 26.7-26.7 26.7l-330.7 0c-14.7 0-26.7-11.9-26.7-26.7z"/></svg>
      <span class="navlabel">Autre écran</span>
    </a>
    <a class="navitem">
      <svg viewBox="0 0 384 512" fill="currentColor"><path d="M192 0c-41.8 0-77.4 26.7-90.5 64L64 64C28.7 64 0 92.7 0 128L0 448c0 35.3 28.7 64 64 64l256 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64l-37.5 0C269.4 26.7 233.8 0 192 0zm0 64a32 32 0 1 1 0 64 32 32 0 1 1 0-64zM305 273L177 401c-9.4 9.4-24.6 9.4-33.9 0L79 337c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L271 239c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"/></svg>
      <span class="navlabel">Troisième écran</span>
    </a>
    <!-- /Exemple de groupe : ajouter d'autres .rail__group si l'espace comporte plusieurs sections -->

    <div class="rail__foot">
      <div class="avatar">DI</div>
      <div class="who"><b>Nom Prénom</b><small>Rôle</small></div>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="topbar__title">
        <h1><!-- Titre de l'écran --></h1>
        <p><!-- Sous-titre : campagne / site / contexte --></p>
      </div>
      <div class="topbar__spacer"></div>
      <!-- Zone droite : adapter selon l'écran (recherche, filtres…) puis cloche + avatar -->
      <button class="iconbtn js-notif"><span class="dot"></span>
        <svg viewBox="0 0 448 512" fill="currentColor"><path d="M224 0c-17.7 0-32 14.3-32 32l0 19.2C119 66 64 130.6 64 208l0 18.8c0 47-17.3 92.4-48.5 127.6l-7.4 8.3c-8.4 9.4-10.4 22.9-5.3 34.4S19.4 416 32 416l384 0c12.6 0 24-7.4 29.2-18.9s3.1-25-5.3-34.4l-7.4-8.3C401.3 319.2 384 273.9 384 226.8l0-18.8c0-77.4-55-142-128-156.8L256 32c0-17.7-14.3-32-32-32zm45.3 493.3c12-12 18.7-28.3 18.7-45.3l-64 0-64 0c0 17 6.7 33.3 18.7 45.3s28.3 18.7 45.3 18.7s33.3-6.7 45.3-18.7z"/></svg>
      </button>
      <div class="avatar avatar--sm">DI</div>
    </header>

    <div class="content">
      <!-- CONTENU DE L'ÉCRAN ICI -->
    </div>
  </div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
